<!DOCTYPE html>
<html>
<head>
  <title>UX Heatmap App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #6200ea;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: white;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #03dac6;
      margin-top: 10px;
    }

    .like {
      font-size: 20px;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>📱 UX Heatmap App</header>

<div class="container">

  <input type="text" placeholder="Buscar..." />

  <div class="card">
    <h3>Producto 1</h3>
    <button>Comprar</button>
    <span class="like">❤️</span>
  </div>

  <div class="card">
    <h3>Producto 2</h3>
    <button>Comprar</button>
    <span class="like">❤️</span>
  </div>

  <div class="card">
    <h3>Producto 3</h3>
    <button>Comprar</button>
    <span class="like">❤️</span>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBp4u6cOWseLMeWXCw4uDadGSbcLfpBjPQ",
  authDomain: "ux-heatmap.firebaseapp.com",
  databaseURL: "https://ux-heatmap-default-rtdb.firebaseio.com",
  projectId: "ux-heatmap",
  storageBucket: "ux-heatmap.firebasestorage.app",
  messagingSenderId: "455315875240",
  appId: "1:455315875240:web:1646e645db5961f0bc299d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔥 COORDENADAS CORRECTAS (IMPORTANTE)
document.addEventListener("click", function(e){
  const rect = document.body.getBoundingClientRect();

  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;

  db.ref("clicks").push({
    x: x,
    y: y,
    time: Date.now()
  });
});
</script>

</body>
</html>
