<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f2f2f2;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  background: #111;
  color: white;
  padding: 12px;
  text-align: center;
  font-size: 18px;
}

/* SEARCH */
.search {
  padding: 10px;
  background: white;
}
.search input {
  width: 95%;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

/* BANNER */
.banner {
  background: linear-gradient(to right, #ff3b3b, orange);
  color: white;
  padding: 20px;
  text-align: center;
  margin: 10px;
  border-radius: 15px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

/* CARD */
.card {
  background: white;
  border-radius: 15px;
  padding: 10px;
  position: relative;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

/* FAVORITO */
.fav {
  position: absolute;
  top: 10px;
  right: 10px;
  background: white;
  padding: 6px;
  border-radius: 50%;
  cursor: pointer;
}

/* BOTÓN */
.btn {
  background: #ff3b3b;
  color: white;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
}

/* SCROLL */
.long {
  height: 900px;
  padding: 20px;
  text-align: center;
}

/* NAV */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 10px;
  border-top: 1px solid #ccc;
}

.nav div {
  font-size: 12px;
}
</style>
</head>

<body>

<header>Project UX</header>

<div class="search">
  <input type="text" placeholder="Buscar productos...">
</div>

<div class="banner">
  🔥 Super ofertas solo hoy 🔥
</div>

<div class="container">

  <div class="card">
    <div class="fav" onclick="fav()">❤️</div>
    <img src="https://via.placeholder.com/200">
    <p>Producto 1</p>
    <div class="btn" onclick="comprar()">Comprar</div>
  </div>

  <div class="card">
    <div class="fav" onclick="fav()">❤️</div>
    <img src="https://via.placeholder.com/200">
    <p>Producto 2</p>
    <div class="btn" onclick="comprar()">Comprar</div>
  </div>

  <div class="card">
    <div class="fav" onclick="fav()">❤️</div>
    <img src="https://via.placeholder.com/200">
    <p>Producto 3</p>
    <div class="btn" onclick="comprar()">Comprar</div>
  </div>

  <div class="card">
    <div class="fav" onclick="fav()">❤️</div>
    <img src="https://via.placeholder.com/200">
    <p>Producto 4</p>
    <div class="btn" onclick="comprar()">Comprar</div>
  </div>

</div>

<div class="long">
  👇 Sigue explorando más contenido 👇
</div>

<div class="nav">
  <div>Inicio</div>
  <div>Categorías</div>
  <div>Carrito</div>
  <div>Perfil</div>
</div>
