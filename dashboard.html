<!DOCTYPE html>
<html>
<head>
  <title>Heatmap Dashboard PRO</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
    }

    .panel {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 10px;
    }

    button {
      margin-top: 10px;
      padding: 8px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .clear {
      background: red;
      color: white;
    }
  </style>

</head>

<body>

<div class="panel">
  <h3>📊 Dashboard UX</h3>
  <p>Total clics: <span id="clicks">0</span></p>
  <button class="clear" onclick="clearData()">🗑 Limpiar datos</button>
</div>

<!-- LIBRERÍA HEATMAP -->
<script src="https://unpkg.com/heatmap.js@2.0.5/build/heatmap.min.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBp4u6cOWseLMeWXCw4uDadGSbcLfpBjPQ",
  authDomain: "ux-heatmap.firebaseapp.com",
  databaseURL: "https://ux-heatmap-default-rtdb.firebaseio.com",
  projectId: "ux-heatmap",
  storageBucket: "ux-heatmap.firebasestorage.app",
  messagingSenderId: "455315875240",
  appId: "1:455315875240:web:1646e645db5961f0bc299d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Crear heatmap
var heatmap = h337.create({
  container: document.body,
  radius: 50
});

// Contador
let totalClicks = 0;
let points = [];

// Escuchar datos en tiempo real
db.ref("clicks").on("child_added", function(snapshot){
  var data = snapshot.val();

  // Convertir coordenadas (IMPORTANTE)
  var x = data.x * window.innerWidth;
  var y = data.y * window.innerHeight;

  points.push({
    x: x,
    y: y,
    value: 1
  });

  // Dibujar heatmap
  heatmap.setData({
    max: 10,
    data: points
  });

  // Actualizar contador
  totalClicks++;
  document.getElementById("clicks").innerText = totalClicks;
});

// Limpiar datos
function clearData(){
  db.ref("clicks").remove();
  location.reload();
}
</script>

</body>
</html>
