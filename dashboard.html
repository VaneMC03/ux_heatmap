<!DOCTYPE html>
<html>
<head>
  <title>Heatmap PRO FINAL</title>

  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .phone {
      position: relative;
      width: 360px;
      height: 640px;
      border: 10px solid #333;
      border-radius: 25px;
      overflow: hidden;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 640px;
      border: none;
      z-index: 1;
    }

    #heatmap {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 640px;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="phone">
  <iframe src="https://vanemc03.github.io/ux_heatmap/"></iframe>
  <div id="heatmap"></div>
</div>

<script src="https://unpkg.com/heatmap.js@2.0.5/build/heatmap.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBp4u6cOWseLMeWXCw4uDadGSbcLfpBjPQ",
  authDomain: "ux-heatmap.firebaseapp.com",
  databaseURL: "https://ux-heatmap-default-rtdb.firebaseio.com",
  projectId: "ux-heatmap",
  storageBucket: "ux-heatmap.firebasestorage.app",
  messagingSenderId: "455315875240",
  appId: "1:455315875240:web:1646e645db5961f0bc299d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const container = document.getElementById("heatmap");

const heatmap = h337.create({
  container: container,
  radius: 80,
  maxOpacity: 1,
  minOpacity: 0.3,
  blur: 1,
  gradient: {
    0.2: "blue",
    0.4: "green",
    0.6: "yellow",
    0.8: "orange",
    1.0: "red"
  }
});

// 🔥 PINTAR EN TIEMPO REAL
db.ref("clicks").on("child_added", function(snapshot){
  const data = snapshot.val();

  if(!data) return;

  const width = container.offsetWidth;
  const height = container.offsetHeight;

  const x = data.x * width;
  const y = data.y * height;

  heatmap.addData({
    x: x,
    y: y,
    value: 100
  });
});
</script>

</body>
</html>
