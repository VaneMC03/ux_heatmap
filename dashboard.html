<!DOCTYPE html>
<html>
<head>
  <title>Heatmap Mobile View</title>

  <style>
    body {
      margin: 0;
      background: #111;
      font-family: Arial;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .phone {
      position: relative;
      width: 360px;
      height: 640px;
      border: 12px solid #333;
      border-radius: 30px;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #heatmap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
    }

  </style>
</head>

<body>

<div class="phone">

  <!-- Tu app -->
  <iframe src="https://vanemc03.github.io/ux_heatmap/"></iframe>

  <!-- Heatmap -->
  <div id="heatmap"></div>

  <!-- Panel -->
  <div class="panel">
    🔥 Heatmap en vivo  
    <br>
    Clics: <span id="clicks">0</span>
  </div>

</div>

<!-- heatmap.js -->
<script src="https://unpkg.com/heatmap.js@2.0.5/build/heatmap.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBp4u6cOWseLMeWXCw4uDadGSbcLfpBjPQ",
  authDomain: "ux-heatmap.firebaseapp.com",
  databaseURL: "https://ux-heatmap-default-rtdb.firebaseio.com",
  projectId: "ux-heatmap",
  storageBucket: "ux-heatmap.firebasestorage.app",
  messagingSenderId: "455315875240",
  appId: "1:455315875240:web:1646e645db5961f0bc299d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Crear heatmap SOBRE el móvil
var heatmap = h337.create({
  container: document.getElementById("heatmap"),
  radius: 40
});

let points = [];
let total = 0;

// Escuchar clics
db.ref("clicks").on("child_added", function(snapshot){
  var data = snapshot.val();

  // Escalar a tamaño del "celular"
  var x = data.x * 360;
  var y = data.y * 640;

  points.push({
    x: x,
    y: y,
    value: 1
  });

  heatmap.setData({
    max: 10,
    data: points
  });

  total++;
  document.getElementById("clicks").innerText = total;
});
</script>

</body>
</html>
